name: build-test-and-validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - weka_artifact: weka-stable
            weka_version: 3.8.7
          - weka_artifact: weka-dev
            weka_version: 3.9.6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and integration tests
        run: >-
          mvn --batch-mode
          -Dweka.artifactId=${{ matrix.weka_artifact }}
          -Dweka.version=${{ matrix.weka_version }}
          verify

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: scripts/test-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: WeibullSurvival-0.1.0
          path: |
            output/WeibullSurvival-0.1.0.zip
            output/SHA256SUMS.txt

  scientific-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: scripts/run-scientific-validation.sh
      - uses: actions/upload-artifact@v7
        with:
          name: scientific-validation
          path: validation/results/*
